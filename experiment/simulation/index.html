<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hemagglutination (HA) Assay Simulation</title>
    <!-- Add Google Font for premium typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <div class="simulation-container">
        <header class="sim-header">
            <h2>Hemagglutination (HA) Assay</h2>
            <p>Newcastle disease virus (NDV) detection and titration procedure</p>
        </header>

        <div class="media-card">
            <div class="media-wrapper">
                <!-- Media Elements (Video only since we have all step videos) -->
                <video id="sliderVideo" class="slider-media" controls muted>
                    Your browser does not support the video tag.
                </video>

                <!-- Navigation Overlay Controls -->
                <button id="prevBtn" class="nav-btn prev" aria-label="Previous step">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <button id="nextBtn" class="nav-btn next" aria-label="Next step">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
            </div>

            <!-- Footer Controls & Progress -->
            <div class="media-footer">
                <div class="progress-bar-container">
                    <div id="progressBar" class="progress-bar"></div>
                </div>
                <div class="footer-row">
                    <span id="stepCounter" class="step-counter">Step 1 of 3</span>
                    <div id="indicators" class="slider-indicators"></div>
                </div>
            </div>
        </div>

        <div class="caption-card">
            <div id="slideCaption" class="slide-caption">
                <!-- Caption injected via JS -->
            </div>
        </div>
    </div>

    <!-- Script at the bottom -->
    <script src="./js/main.js"></script>
</body>
</html>
